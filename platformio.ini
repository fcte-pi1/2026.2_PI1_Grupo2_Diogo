[platformio]
src_dir = src/firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Encoder
    adafruit/Adafruit INA219
    adafruit/Adafruit_VL53L0X @ ^1.2.5

; Para OTA, defina OTA_PASSWORD em config.h ANTES de usar.
; Troque o protocolo de upload para espota e configure a autenticação,
; conforme o README. No primeiro teste use o cabo USB.
; upload_protocol = espota
; upload_port = 192.168.4.1
; upload_flags = --auth=SUA_SENHA_OTA
