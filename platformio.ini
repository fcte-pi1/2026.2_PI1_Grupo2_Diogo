[platformio]
src_dir = src/firmware
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

; Garante a exportação do banco de dados de compilação e caminhos de cabeçalho
build_flags = 
    -Isrc/firmware
; Os firmwares de teste de bancada ficam fora do firmware do robô
build_src_filter = +<*> -<testes/>

; Bibliotecas necessárias para os sensores e periféricos do robô
lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit INA219 @ ^1.2.3
    bblanchon/ArduinoJson @ ^7.0.4

; -------------------------------------------------------------------------
; UPLOAD VIA WI-FI (OTA):
; Descomente as duas linhas abaixo quando for gravar SEM O CABO USB:
upload_protocol = espota
upload_port = 192.168.4.1
; -------------------------------------------------------------------------

; Firmware do teste de consumo por componente (docs/7.2). Só grava por USB:
; pio run -e teste-energia -t upload
[env:teste-energia]
platform = ${env:esp32dev.platform}
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -Isrc/firmware
build_src_filter = -<*> +<testes/energia.cpp>
lib_deps = ${env:esp32dev.lib_deps}

; Testes da lógica pura no PC, sem a placa: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -Isrc/firmware
