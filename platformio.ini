[platformio]
src_dir = src/firmware
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

; Garante a exportação do banco de dados de compilação e caminhos de cabeçalho
build_flags = 
    -Isrc/firmware

; Módulos do firmware anterior que ficam fora da compilação desde a integração
; da V4.7, que traz os seus equivalentes (telemetry_remote e i2c_diagnostics).
build_src_filter =
    +<*>
    -<telemetry.cpp>
    -<i2c_check.cpp>

; Bibliotecas necessárias para os sensores e periféricos do robô
lib_deps =
    madhephaestus/ESP32Encoder
    adafruit/Adafruit_VL53L0X @ ^1.2.5
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit INA219 @ ^1.2.3
    bblanchon/ArduinoJson @ ^7.0.4

; -------------------------------------------------------------------------
; UPLOAD VIA WI-FI (OTA):
; Na V4.7 o OTA fica desligado até definir OTA_PASSWORD no config.h.
; No primeiro teste use o cabo USB. Para gravar por WiFi, defina a senha e
; descomente as linhas abaixo:
; upload_protocol = espota
; upload_port = 192.168.4.1
; upload_flags = --auth=SUA_SENHA_OTA
; -------------------------------------------------------------------------

; Testes da lógica pura no PC, sem a placa: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -Isrc/firmware
